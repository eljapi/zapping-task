services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zapping
      POSTGRES_PASSWORD: zapping
      POSTGRES_DB: zapping
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
