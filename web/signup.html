<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%230f1115"/><circle cx="16" cy="16" r="7" fill="%23ff4d4d"/></svg>'>
<title>Create account — Infinite Stream</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<main>
  <header>
    <h1>Infinite Stream</h1>
    <span class="live"><span class="dot"></span>Live</span>
  </header>
  <p class="sub">Create an account to watch the stream.</p>

  <p id="error"></p>

  <form method="post" action="/signup">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name" autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit">Create account</button>
  </form>

  <p class="alt">Already registered? <a href="/login">Sign in</a></p>
</main>
<script src="/static/auth.js"></script>
</body>
</html>
