<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%230f1115"/><circle cx="16" cy="16" r="7" fill="%23ff4d4d"/></svg>'>
<title>Create account — Zapping</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --live: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .live {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    color: var(--live); text-transform: uppercase;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live); animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  label {
    display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin: 0 0 5px;
  }
  .field { margin-bottom: 15px; }
  input {
    width: 100%; padding: 10px 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--muted); }
  button {
    width: 100%; padding: 11px;
    background: var(--text); color: var(--bg);
    border: 0; border-radius: 8px;
    font: 600 15px/1 inherit; cursor: pointer; margin-top: 6px;
  }
  button:hover { opacity: .88; }
  .alt { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0 0; }
  .alt a { color: var(--text); }
  #error {
    padding: 9px 12px; margin: 0 0 18px;
    border-radius: 8px; border: 1px solid #5c2626;
    background: #2a1414; color: #ffb4b4;
    font-size: 13px; display: none;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Zapping</h1>
    <span class="live"><span class="dot"></span>Live</span>
  </header>
  <p class="sub">Create an account to watch the stream.</p>

  <p id="error"></p>

  <form method="post" action="/signup">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name" autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit">Create account</button>
  </form>

  <p class="alt">Already registered? <a href="/login">Sign in</a></p>
</main>

<script>
  const MESSAGES = {
    invalid: "Please enter a name and a valid email.",
    password: "Password must be at least 8 characters.",
    taken: "That email is already registered.",
  };
  const code = new URLSearchParams(location.search).get("error");
  if (code) {
    const box = document.getElementById("error");
    box.textContent = MESSAGES[code] || "Something went wrong.";
    box.style.display = "block";
  }
</script>
</body>
</html>
