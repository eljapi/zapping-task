<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%230f1115"/><circle cx="16" cy="16" r="7" fill="%23ff4d4d"/></svg>'>
<title>Player</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/player.css">
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<main>
  <header>
    <h1>Zapping</h1>
    <span class="live"><span class="dot"></span>Live</span>
    <form method="post" action="/logout" class="logout"><button type="submit">Sign out</button></form>
  </header>

  <video id="video" controls autoplay muted playsinline></video>

  <dl class="stats">
    <div class="stat"><dt>Media sequence</dt><dd id="seq">—</dd></div>
    <div class="stat"><dt>Segments in window</dt><dd id="count">—</dd></div>
    <div class="stat"><dt>Target duration</dt><dd id="target">—</dd></div>
    <div class="stat"><dt>Playlist reloads</dt><dd id="reloads">0</dd></div>
  </dl>

  <p id="error"></p>

  <section class="chat">
    <h2>Chat</h2>
    <ul id="chat-messages"></ul>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Say something" maxlength="200" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="/static/player.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>
